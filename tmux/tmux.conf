# reload tmux conf with Prefix + r
bind r source-file ~/.tmux.conf

set -g base-index 1
set -g mouse on
set -g renumber-windows on
set -g status-left-length 20
set -g focus-events on

set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -s set-clipboard external

set -g escape-time 0
set -g repeat-time 750
set -g history-limit 50000
set -g status-interval 5

setw -g aggressive-resize on

set -g mode-keys vi
set -g status-keys vi
set -g status-position top

bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R
bind M-c attach-session -c "#{pane_current_path}" \; display "\n\n\n\ncwd updated"

# Pass on Ctrl+Tab and Ctrl+Shift+Tab
#   Tips: use `showkey -a` to examine
#   See: https://groups.google.com/g/tmux-users/c/HFmUpUfrKmg?pli=1
set -g extended-keys always

# ========================= TMUX PLUGIN MANAGER ================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @resurrect-dir '~/.tmux/resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/t-smart-tmux-session-manager'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-command 'tmux set-buffer -w "{}"'                 # https://github.com/fcsonline/tmux-thumbs?tab=readme-ov-file#thumbs-upcase-command
set -g @thumbs-upcase-command 'tmux set-buffer -- {} && tmux paste-buffer'     # https://github.com/fcsonline/tmux-thumbs?tab=readme-ov-file#thumbs-command
set -g @thumbs-multi-command 'tmux set-buffer -w "{}"'                  # https://github.com/fcsonline/tmux-thumbs?tab=readme-ov-file#thumbs-multi-command
set -g @thumbs-contrast 1
set -g @thumbs-position off_left

# set -g @thumbs-osc52 1
set -g allow-passthrough all
# set -g @thumbs-command 'tmux set-buffer -w "{}"'
# set -g @thumbs-upcase-command 'echo -n {} | clipcopy'                 # https://github.com/fcsonline/tmux-thumbs?tab=readme-ov-file#thumbs-upcase-command
# set -g @thumbs-upcase-command 'tmux set-buffer -w "{}" && tmux paste-buffer'
# set -g @thumbs-multi-command 'echo -n {} | clipcopy'                  # https://github.com/fcsonline/tmux-thumbs?tab=readme-ov-file#thumbs-multi-command

# ========================= ROSE PINE THEME ====================================
set -g @plugin 'rose-pine/tmux'

# Variant: main (soho dark), moon (darker), dawn (light)
set -g @rose_pine_variant 'moon'

# Transparent bg -- blends with Kitty's opacity + blur
set -g @rose_pine_bar_bg_disable 'off'
set -g @rose_pine_bar_bg_disabled_color_option 'default'

# Separators -- arrow style like the repo showcase
set -g @rose_pine_left_separator ' → '
set -g @rose_pine_right_separator ' ← '
set -g @rose_pine_field_separator ' | '
set -g @rose_pine_window_status_separator " :: "

# Window behavior
set -g @rose_pine_only_windows 'off'
set -g @rose_pine_disable_active_window_menu 'off'
set -g @rose_pine_default_window_behavior 'on'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_show_pane_directory 'off'

# Status modules
set -g @rose_pine_host 'on'
set -g @rose_pine_hostname_short 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'on'
set -g @rose_pine_date_time '%H:%M'

# Icons (nerd font)
set -g @rose_pine_session_icon ''
set -g @rose_pine_current_window_icon ''
set -g @rose_pine_folder_icon ''
set -g @rose_pine_username_icon ''
set -g @rose_pine_hostname_icon '󰒋'
set -g @rose_pine_date_time_icon '󰥔'

# Prioritize windows when space is tight
set -g @rose_pine_prioritize_windows 'on'
set -g @rose_pine_width_to_hide '80'
set -g @rose_pine_window_count '5'

# ofirgall/tmux-window-name
set -g @tmux_window_name_shells "['bash', 'fish', 'sh', 'zsh']"
set -g @tmux_window_name_use_tilde "True"
set -g @tmux_window_dir_programs "['nvim', 'vim', 'vi', 'git']"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
